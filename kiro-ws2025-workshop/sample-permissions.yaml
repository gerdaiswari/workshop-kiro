# Copy selected rules into ~/.kiro/settings/permissions.yaml.
# Kiro permissions intentionally live outside the repository.
rules:
  - capability: fs_read
    effect: allow

  - capability: fs_write
    effect: allow
    match:
      - "scripts/**"
      - "tests/**"
      - "apps/**"
      - "infra/**"
      - "inventory/**"
      - "results/**"
      - "docs/**"
      - "modules/**"
      - ".kiro/specs/**"

  - capability: shell
    effect: allow
    match:
      - "python3 tests/static/validate_repo.py*"
      - "python3 scripts/01_collect_inventory.py*"
      - "python3 scripts/02_analyze_compatibility.py*"
      - "python3 scripts/03_run_tests.py*"
      - "aws sts get-caller-identity*"
      - "aws cloudformation describe-*"
      - "aws ec2 describe-*"
      - "aws ssm describe-*"
      - "aws ssm get-*"
      - "aws ssm list-*"
      - "git status*"
      - "git diff*"

  - capability: shell
    effect: ask
    match:
      - "./scripts/00_deploy.sh*"
      - "python3 scripts/04_start_upgrade.py*"
      - "python3 scripts/05_launch_validation.py*"
      - "python3 scripts/07_app_cutover.py*"
      - "./scripts/08_cleanup.sh*"
      - "aws ssm start-automation-execution*"
      - "aws ec2 run-instances*"
      - "aws elbv2 register-targets*"
      - "aws elbv2 deregister-targets*"

  - capability: shell
    effect: deny
    match:
      - "aws ec2 terminate-instances*"
      - "aws ec2 delete-snapshot*"
      - "aws ec2 deregister-image*"
      - "aws cloudformation delete-stack*"
      - "rm -rf *"

  - capability: mcp
    effect: allow
    match:
      - "aws-knowledge-mcp-server/*"
