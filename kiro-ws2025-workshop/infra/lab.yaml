AWSTemplateFormatVersion: '2010-09-09'
Description: Kiro Windows Server 2019 to 2025 upgrade workshop lab

Parameters:
  ArtifactBucketName:
    Type: String
  ArtifactKey:
    Type: String
    Default: payload/workshop-payload.zip
  XamppArtifactKey:
    Type: String
    Default: dependencies/xampp-windows-x64-8.2.12-0-VS16-installer.exe
  Windows2019Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2019-English-Full-Base
  AppInstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, m5.large, m5.xlarge]
  DataInstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.xlarge, t3.2xlarge, m5.xlarge, m5.2xlarge]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-vpc'}
        - {Key: Project, Value: kiro-ws2025-workshop}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Project, Value: kiro-ws2025-workshop}

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-public-a'}
        - {Key: Project, Value: kiro-ws2025-workshop}

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-public-b'}
        - {Key: Project, Value: kiro-ws2025-workshop}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Project, Value: kiro-ws2025-workshop}

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}

  SubnetRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP for synthetic workshop applications
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0}
      Tags:
        - {Key: Project, Value: kiro-ws2025-workshop}

  WorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No direct internet ingress; ALB application ports only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup}
        - {IpProtocol: tcp, FromPort: 8081, ToPort: 8081, SourceSecurityGroupId: !Ref AlbSecurityGroup}
        - {IpProtocol: tcp, FromPort: 8082, ToPort: 8082, SourceSecurityGroupId: !Ref AlbSecurityGroup}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0}
      Tags:
        - {Key: Project, Value: kiro-ws2025-workshop}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: WorkshopBootstrapAndSignal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ArtifactKey}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${XamppArtifactKey}'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/logs/*'
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId
      Tags:
        - {Key: Project, Value: kiro-ws2025-workshop}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-ssm-profile'
      Roles: [!Ref InstanceRole]

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    CreationPolicy:
      ResourceSignal: {Count: 1, Timeout: PT90M}
    Properties:
      ImageId: !Ref Windows2019Ami
      InstanceType: !Ref AppInstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref WorkloadSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 80
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: APP01}
        - {Key: Project, Value: kiro-ws2025-workshop}
        - {Key: Environment, Value: lab}
        - {Key: Role, Value: APP01}
        - {Key: SourceOS, Value: WindowsServer2019}
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\Workshop | Out-Null
          $exitCode = 0
          try {
            Read-S3Object -BucketName '${ArtifactBucketName}' -Key '${ArtifactKey}' -File C:\Workshop\payload.zip
            Expand-Archive C:\Workshop\payload.zip C:\Workshop\payload -Force
            & C:\Workshop\payload\bootstrap\app01.ps1 -PayloadRoot C:\Workshop\payload
          } catch {
            $exitCode = 1
            $_ | Out-String | Set-Content C:\Workshop\userdata-error.txt
          }
          foreach ($log in @('C:\Workshop\userdata-error.txt','C:\Workshop\bootstrap-error.txt','C:\Workshop\bootstrap.log','C:\Workshop\app01-bootstrap-transcript.log','C:\Workshop\bootstrap-status.json')) {
            if (Test-Path $log) {
              try { Write-S3Object -BucketName '${ArtifactBucketName}' -Key "logs/${AWS::StackName}/AppInstance/$(Split-Path $log -Leaf)" -File $log } catch { }
            }
          }
          & 'C:\Program Files\Amazon\cfn-bootstrap\cfn-signal.exe' -e $exitCode --stack '${AWS::StackName}' --resource AppInstance --region '${AWS::Region}'
          exit $exitCode
          </powershell>

  DataInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    CreationPolicy:
      ResourceSignal: {Count: 1, Timeout: PT120M}
    Properties:
      ImageId: !Ref Windows2019Ami
      InstanceType: !Ref DataInstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref WorkloadSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 100
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: DATA01}
        - {Key: Project, Value: kiro-ws2025-workshop}
        - {Key: Environment, Value: lab}
        - {Key: Role, Value: DATA01}
        - {Key: SourceOS, Value: WindowsServer2019}
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\Workshop | Out-Null
          $exitCode = 0
          try {
            Read-S3Object -BucketName '${ArtifactBucketName}' -Key '${ArtifactKey}' -File C:\Workshop\payload.zip
            Expand-Archive C:\Workshop\payload.zip C:\Workshop\payload -Force
            & C:\Workshop\payload\bootstrap\data01.ps1 `
              -PayloadRoot C:\Workshop\payload `
              -ArtifactBucket '${ArtifactBucketName}' `
              -XamppArtifactKey '${XamppArtifactKey}'
          } catch {
            $exitCode = 1
            $_ | Out-String | Set-Content C:\Workshop\userdata-error.txt
          }
          foreach ($log in @('C:\Workshop\userdata-error.txt','C:\Workshop\bootstrap-error.txt','C:\Workshop\bootstrap.log','C:\Workshop\data01-bootstrap-transcript.log','C:\Workshop\sqlserver-setup-summary.txt','C:\Workshop\bootstrap-status.json')) {
            if (Test-Path $log) {
              try { Write-S3Object -BucketName '${ArtifactBucketName}' -Key "logs/${AWS::StackName}/DataInstance/$(Split-Path $log -Leaf)" -File $log } catch { }
            }
          }
          & 'C:\Program Files\Amazon\cfn-bootstrap\cfn-signal.exe' -e $exitCode --stack '${AWS::StackName}' --resource DataInstance --region '${AWS::Region}'
          exit $exitCode
          </powershell>

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      Tags:
        - {Key: Project, Value: kiro-ws2025-workshop}

  AppIisTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health.html
      Matcher: {HttpCode: '200'}
      Targets: [{Id: !Ref AppInstance, Port: 80}]
      Tags: [{Key: Project, Value: kiro-ws2025-workshop}]

  AppNginxTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8081
      TargetType: instance
      HealthCheckPath: /health
      Matcher: {HttpCode: '200'}
      Targets: [{Id: !Ref AppInstance, Port: 8081}]
      Tags: [{Key: Project, Value: kiro-ws2025-workshop}]

  DataPhpTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8082
      TargetType: instance
      HealthCheckPath: /data/api/status.php
      Matcher: {HttpCode: '200'}
      Targets: [{Id: !Ref DataInstance, Port: 8082}]
      Tags: [{Key: Project, Value: kiro-ws2025-workshop}]

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppIisTargetGroup

  AppProxyRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ['/spring*', '/next*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AppNginxTargetGroup

  DataPhpRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values: ['/data*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref DataPhpTargetGroup

Outputs:
  AppInstanceId:
    Value: !Ref AppInstance
  DataInstanceId:
    Value: !Ref DataInstance
  PublicSubnetId:
    Value: !Ref PublicSubnetA
  WorkloadSecurityGroupId:
    Value: !Ref WorkloadSecurityGroup
  InstanceProfileName:
    Value: !Ref InstanceProfile
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
  AppIisTargetGroupArn:
    Value: !Ref AppIisTargetGroup
  AppNginxTargetGroupArn:
    Value: !Ref AppNginxTargetGroup
  DataPhpTargetGroupArn:
    Value: !Ref DataPhpTargetGroup
  ArtifactBucketName:
    Value: !Ref ArtifactBucketName
  SourceAmiId:
    Value: !Ref Windows2019Ami
